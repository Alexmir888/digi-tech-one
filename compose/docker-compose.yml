services:
  app-1:
    image: "xmyronenkoo/oleksandr_myronenko:1.0"
    environment:
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - notes-data:/data

  app-2:
    image: "xmyronenkoo/oleksandr_myronenko:1.0"
    environment:
      PORT: 3002
    ports:
      - "3002:3002"
    volumes:
      - notes-data:/data

  app-3:
    image: "xmyronenkoo/oleksandr_myronenko:1.0"
    environment:
      PORT: 3003
    ports:
      - "3003:3003"
    volumes:
      - notes-data:/data

  app-4:
    image: "xmyronenkoo/oleksandr_myronenko:1.0"
    environment:
      PORT: 3004
    ports:
      - "3004:3004"
    volumes:
      - notes-data:/data

  app-5:
    image: "xmyronenkoo/oleksandr_myronenko:1.0"
    environment:
      PORT: 3005
    ports:
      - "3005:3005"
    volumes:
      - notes-data:/data

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-1
      - app-2
      - app-3
      - app-4
      - app-5
    ports:
      - "5000:4000"

volumes:
  notes-data: