services:
  digi-tech-one:
    image: "xmyronenkoo/oleksandr_myronenko:1.0"
    expose:
      - "3000"
    volumes:
      - notes-data:/data

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - digi-tech-one
    ports:
      - "5000:4000"

volumes:
  notes-data: