user  nginx;

events {
    worker_connections 1000;   # максимальное число соединений
}

http {
    upstream digi_tech_one {
        server app-1:3001;
        server app-2:3002;
        server app-3:3003;
        server app-4:3004;
        server app-5:3005;
    }

    server {
        listen 4000;           # на каком порту слушает Nginx

        location / {
            proxy_pass http://digi_tech_one;        # балансировка по кругу между экземплярами
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}