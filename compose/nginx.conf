user  nginx;

events {
    worker_connections 1000;   # максимальное число соединений
}

http {
    server {
        listen 4000;           # на каком порту слушает Nginx

        location / {
            proxy_pass http://digi-tech-one:3000;   # куда пересылать запросы
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}